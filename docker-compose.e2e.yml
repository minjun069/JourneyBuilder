services:
  schema-init:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-retirewise_db}"
      PGUSER: "${POSTGRES_USER:-retirewise}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --set=schema=${F05_DB_SCHEMA:?F05_DB_SCHEMA is required}
      - --file=/e2e/schema-init.sql
    volumes:
      - ./front-pjt/tests/e2e/f05/schema-init.sql:/e2e/schema-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  migrate:
    environment:
      POSTGRES_SCHEMA: "${F05_DB_SCHEMA:?F05_DB_SCHEMA is required}"
      AI_REDIS_NAMESPACE: "${F05_REDIS_NAMESPACE:?F05_REDIS_NAMESPACE is required}"
    depends_on:
      schema-init:
        condition: service_completed_successfully

  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,gateway,front
      POSTGRES_SCHEMA: "${F05_DB_SCHEMA:?F05_DB_SCHEMA is required}"
      AI_REDIS_NAMESPACE: "${F05_REDIS_NAMESPACE:?F05_REDIS_NAMESPACE is required}"
      AI_SERVICE_URL: http://fixture-ai:8001

  fixture-ai:
    build:
      context: .
      dockerfile: front-pjt/tests/e2e/f05/Dockerfile
      target: front
    command: ["node", "tests/e2e/f05/fixture-ai.mjs"]
    environment:
      AI_SERVICE_BEARER_TOKEN: "${AI_SERVICE_BEARER_TOKEN:?AI_SERVICE_BEARER_TOKEN is required}"
      F05_CONTROL_TOKEN: "${F05_CONTROL_TOKEN:?F05_CONTROL_TOKEN is required}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/api/system/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    expose:
      - "8001"
    networks:
      - application

  front:
    build:
      context: .
      dockerfile: front-pjt/tests/e2e/f05/Dockerfile
      target: front
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://gateway
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/ai').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    expose:
      - "5173"
    networks:
      - application

  e2e:
    build:
      context: .
      dockerfile: front-pjt/tests/e2e/f05/Dockerfile
      target: e2e
    environment:
      F05_BASE_URL: http://front:5173
      F05_FIXTURE_URL: http://fixture-ai:8001
      F05_CONTROL_TOKEN: "${F05_CONTROL_TOKEN:?F05_CONTROL_TOKEN is required}"
      F05_SCENARIO_ID: "${F05_SCENARIO_ID:?F05_SCENARIO_ID is required}"
      F05_DB_SCHEMA: "${F05_DB_SCHEMA:?F05_DB_SCHEMA is required}"
      F05_REDIS_NAMESPACE: "${F05_REDIS_NAMESPACE:?F05_REDIS_NAMESPACE is required}"
      POSTGRES_DB: "${POSTGRES_DB:-retirewise_db}"
      POSTGRES_USER: "${POSTGRES_USER:-retirewise}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      fixture-ai:
        condition: service_healthy
      front:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application
