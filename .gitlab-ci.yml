# GitLab CI — S15P21B109
#
# 러너: EC2 self-hosted, shell executor (태그 ssafy-ec2). 잡은 호스트 docker 를 직접 쓴다.
# 설계 근거·서버 세팅 절차: deploy/README.md (S15P21B109-122), 참고 세팅: 이전 프로젝트 S15P11B204.
#
# 스테이지
#   test   — 모든 브랜치 push 와 MR 에서 실행. 팀 Makefile 의 g1-* 검사를 그대로 옮겼다.
#            이미지 빌드가 곧 빌드 검증이므로 별도 build 스테이지는 두지 않는다(서버에서 --build).
#   deploy — master 머지 시에만. S15P21B109-125 에서 추가한다.
#
# 원칙
#   - 테스트는 체크아웃된 저장소를 컨테이너에 마운트해서 돈다. 이미지는 의존성 확보용이다.
#     backend 이미지는 .dockerignore 가 tests/ 를 제외하고, contract_tests 는 저장소 루트의
#     contract-fixtures/ 를 상대 경로로 읽으므로 저장소 전체를 /src 에 마운트하고 하위 디렉터리에서 실행한다.
#   - 비밀값은 CI Variables 에 두지 않는다(204 패턴, 서버 /srv/s15p21b109/secrets). 테스트용 더미는 여기 평문으로 둔다 —
#     runtime_env.INSECURE_SECRET_VALUES 에 걸리지 않는 값이면 되고, 운영 값과 무관하다. 외부 호출은 테스트가 모킹한다.
#   - g1_gate.py 는 파일 해시를 비교하므로 CRLF 체크아웃(Windows autocrlf)에서는 로컬 실패한다. 러너(Linux, LF)에서는 통과.

stages:
  - test

default:
  tags: [ssafy-ec2]
  interruptible: true

variables:
  GIT_DEPTH: "50"            # g1_gate.py 가 git merge-base 를 쓰므로 너무 얕으면 실패한다
  DOCKER_BUILDKIT: "1"
  # 테스트 전용 더미 (운영 값 아님)
  CI_DJANGO_SECRET_KEY: "ci-only-django-secret-key-not-for-production"
  CI_POSTGRES_PASSWORD: "ci-only-postgres-password"
  CI_AI_SERVICE_BEARER_TOKEN: "ci-only-ai-bearer-token"
  CI_GOOGLE_API_KEY: "ci-only-dummy-google-key"   # ai 설정 검증(validate_runtime) 통과용. 실제 호출 없음
  CI_DATABASE_URL: "postgresql://ci:ci-only-db-password@localhost:5432/ci"   # 동일. 로컬에선 루트 .env 가 load_dotenv 로 잡혀 통과했지만 CI 에는 .env 가 없다

workflow:
  rules:
    # MR 이 열린 브랜치는 MR 파이프라인만 돌린다 (브랜치 + MR 이중 실행 방지)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ── 결정적 검사: 산출물 정합성 (Makefile g1-foundation). 표준 라이브러리 + git 만 필요 → 호스트 python3 ──
test:foundation:
  stage: test
  script:
    - python3 --version
    - python3 g1_gate.py

# ── backend (Makefile g1-backend): 이미지로 의존성 확보, 저장소 루트를 /src 에 마운트 ──
test:backend:
  stage: test
  script:
    - docker build -q -t ci-backend:$CI_COMMIT_SHORT_SHA backend-pjt
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/src:ro" -w /src/backend-pjt
      -e DJANGO_SECRET_KEY="$CI_DJANGO_SECRET_KEY"
      -e POSTGRES_PASSWORD="$CI_POSTGRES_PASSWORD"
      -e AI_SERVICE_BEARER_TOKEN="$CI_AI_SERVICE_BEARER_TOKEN"
      -e DJANGO_DEBUG=false
      ci-backend:$CI_COMMIT_SHORT_SHA
      sh -c "python -m unittest discover -s tests -v && python -m unittest discover -s contract_tests -v"
  after_script:
    - docker image rm -f ci-backend:$CI_COMMIT_SHORT_SHA >/dev/null 2>&1 || true

# ── ai (Makefile g1-ai · g1-rag · g1-tools · g1-observability · g1-security): 빌드 컨텍스트는 루트 ──
test:ai:
  stage: test
  script:
    - docker build -q -f ai-pjt/Dockerfile -t ci-ai:$CI_COMMIT_SHORT_SHA .
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/src" -w /src/ai-pjt
      -e AI_SERVICE_BEARER_TOKEN="$CI_AI_SERVICE_BEARER_TOKEN"
      -e GOOGLE_API_KEY="$CI_GOOGLE_API_KEY"
      -e DATABASE_URL="$CI_DATABASE_URL"
      ci-ai:$CI_COMMIT_SHORT_SHA
      sh -c "
        python -m unittest discover -s tests -v &&
        python -m unittest discover -s rag/tests -v &&
        python -m unittest discover -s tools/tests -v &&
        python -m unittest discover -s evals/tests -v &&
        cd evals/security && python -m unittest -v test_security_regression.py"
  after_script:
    - docker image rm -f ci-ai:$CI_COMMIT_SHORT_SHA >/dev/null 2>&1 || true

# ── front (Makefile g1-node 와 동일): node 컨테이너에 마운트, npm test + p07 e2e ──
# lint 는 게이트에 넣지 않는다. 2026-09-07 기준 현재 코드가 oxlint 154 / eslint 44 오류 상태이고
# 팀 스크립트(npm run lint)는 --fix 로 돌려서 통과시키는 방식이다. 정리되면 별도 잡으로 추가한다.
test:front:
  stage: test
  script:
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/workspace" -w /workspace/front-pjt
      node:22-bookworm
      sh -c "npm ci --no-audit --no-fund && npm test"
    - >
      docker run --rm
      -v "$CI_PROJECT_DIR:/workspace:ro" -w /workspace
      node:22-bookworm
      node --test front-pjt/tests/e2e/p07/p07-preparation.test.mjs
