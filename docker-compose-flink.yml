# Flink JobManager, Flink TaskManager
# Kafka topic을 읽고 스트리밍 방식으로 데이터 처리

services:
  jobmanager:
    build: .
    image: pyflink
    container_name: flink_jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    env_file:
      - .env
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=streaming_data
      - DB_USERNAME=ssafy
      - DB_PASSWORD=ssafy
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=news
    volumes:
      - ./data-pjt/consumer:/opt/flink/consumer
    networks:
      - de_net

  taskmanager:
    build: .
    image: pyflink
    container_name: flink_taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    env_file:
      - .env
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=streaming_data
      - DB_USERNAME=ssafy
      - DB_PASSWORD=ssafy
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=news
    volumes:
      - ./data-pjt/consumer:/opt/flink/consumer
    networks:
      - de_net

networks:
  de_net:
    external: true
