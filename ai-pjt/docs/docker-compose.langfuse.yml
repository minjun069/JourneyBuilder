# ⚠️  EXPERIMENTS — Langfuse 자체 호스팅 참고 스니펫
#
# 사용법:
#   1. 아래 내용을 프로젝트 루트 docker-compose.yml 의 services 블록에 병합
#   2. PostgreSQL 에 langfuse DB 생성:
#        docker exec <db_container> psql -U postgres -c "CREATE DATABASE langfuse;"
#   3. NEXTAUTH_SECRET, SALT 를 안전한 랜덤 문자열로 교체
#   4. 서비스 재시작 후 http://localhost:3001 접속해 계정 생성
#   5. 생성된 API 키를 .env 의 LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY 에 설정

services:
  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/langfuse  # db 서비스명 확인
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: "CHANGE_ME_RANDOM_SECRET_32CHARS"
      SALT: "CHANGE_ME_RANDOM_SALT"
      TELEMETRY_ENABLED: "false"
    networks:
      - de_net          # 프로젝트 네트워크명에 맞게 수정
    depends_on:
      - db              # 기존 postgres 서비스명에 맞게 수정

# ── .env 설정 예시 ────────────────────────────────────────────────────────────
# LANGFUSE_ENABLED=true
# LANGFUSE_PUBLIC_KEY=pk-lf-xxxxxxxxxxxxxxxx
# LANGFUSE_SECRET_KEY=sk-lf-xxxxxxxxxxxxxxxx
# LANGFUSE_HOST=http://langfuse:3000   # Docker 내부 통신 시
# LANGFUSE_HOST=http://localhost:3001  # 로컬 직접 실행 시
