# Spark 인프라 (뉴스 데이터 정제 / 키워드 / 카테고리 / 임베딩 처리)
#
# 구성:
#   - spark-master : 클러스터 매니저 + Web UI(8080) + RPC(7077)
#   - spark-worker : 실제 작업 실행 (executor)
#
# pyspark==3.5.4 와 버전을 맞추기 위해 bitnamilegacy/spark:3.5.4 사용.
# (2025-08 Bitnami 정책 변경으로 무료 버전 태그가 bitnami -> bitnamilegacy 로 이동됨)
# HDFS(hdfs://namenode:9000) 접근은 같은 de_net 네트워크 + 번들된 hadoop 클라이언트로 가능.
#
# 코드 마운트:
#   ../ (data-pjt) -> /opt/app   (spark-submit /opt/app/news/spark_jobs/*.py)
#   PYTHONPATH=/opt/app 로 'from common...' import 가능

services:
  spark-master:
    image: bitnamilegacy/spark:3.5.4
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/app
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC (spark://spark-master:7077)
    volumes:
      - ../:/opt/app
    networks:
      - de_net

  spark-worker:
    image: bitnamilegacy/spark:3.5.4
    container_name: spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYTHONPATH=/opt/app
    ports:
      - "8082:8081"   # Spark Worker Web UI (8081은 Flink와 겹쳐 8082로 매핑)
    volumes:
      - ../:/opt/app
    networks:
      - de_net

networks:
  de_net:
    external: true
