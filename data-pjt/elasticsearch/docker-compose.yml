# Elasticsearch 인프라 (한국어 뉴스 전문검색 - reports 도메인에서 사용)
#
# 구성:
#   - elasticsearch : 단일 노드 + nori(한국어 형태소 분석) 플러그인
#
# 커스텀 이미지(es-nori)를 빌드해서 사용 (Dockerfile 참고).
# 개발 편의를 위해 보안(xpack.security)은 비활성화 - 운영에서는 활성화 권장.
#
# ⚠️ 사전 요건: 호스트의 vm.max_map_count >= 262144
#    확인:  sysctl vm.max_map_count
#    설정:  sudo sysctl -w vm.max_map_count=262144   (영구: /etc/sysctl.conf 에 추가)

services:
  elasticsearch:
    build: .
    image: es-nori:8.17.1
    container_name: elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node          # 단일 노드 모드
      - xpack.security.enabled=false        # 개발용 (인증 비활성화)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # JVM heap (리소스에 맞게 조정)
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API
      - "9300:9300"   # 노드 간 통신
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - de_net

volumes:
  es_data:

networks:
  de_net:
    external: true
