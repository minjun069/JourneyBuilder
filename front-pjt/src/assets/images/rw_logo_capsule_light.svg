<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- 접합부(위쪽 끝)가 파랗게 물드는 그라데이션: 다음 캡슐 뒤로 말려 들어가는 느낌 -->
    <linearGradient id="capTuck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.45" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#7472f2"/>
    </linearGradient>
    <linearGradient id="capFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5ce6"/>
      <stop offset="1" stop-color="#7472f2"/>
    </linearGradient>
    <!-- 캡슐이 서로에게 드리우는 부드러운 그림자 -->
    <filter id="capShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-3" dy="7" stdDeviation="7" flood-color="#312e81" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 상승하는 캡슐 3개: 아래 캡슐의 위쪽 끝이 다음 캡슐 뒤로 겹침 -->
  <rect x="51" y="91" width="44" height="120" rx="22" fill="url(#capTuck)" filter="url(#capShadow)" transform="rotate(30 73 151)"/>
  <rect x="106" y="68" width="44" height="120" rx="22" fill="url(#capTuck)" filter="url(#capShadow)" transform="rotate(30 128 128)"/>
  <rect x="161" y="45" width="44" height="120" rx="22" fill="url(#capFront)" filter="url(#capShadow)" transform="rotate(30 183 105)"/>
</svg>
