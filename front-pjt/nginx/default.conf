# 단일 진입점 nginx: 정적 SPA 서빙 + /api 리버스 프록시.
# 443/HTTPS 는 S15P21B109-123 에서 추가한다. 여기서는 80 만 연다.
#
# upstream 은 compose 서비스명(backend:8000)이다. 변수 + resolver 를 쓰는 이유:
# 고정 proxy_pass 는 nginx 기동 시점에 DNS 를 조회해서 backend 가 아직 없으면 nginx 자체가 죽는다.
# 변수를 쓰면 요청 시점에 조회하므로 기동 순서와 무관하게 살아 있다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django API 와 AI 콜백(backend 가 노출). 브라우저는 ai 컨테이너를 직접 부르지 않는다.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # SSE(S15P21B109-106) 대비: 응답 버퍼링을 끄면 스트림이 즉시 전달된다
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 해시가 붙은 빌드 산출물은 장기 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history 모드: 나머지 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
