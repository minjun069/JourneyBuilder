# front 컨테이너 nginx: 정적 SPA 서빙 담당.
# 운영 경로: 호스트 nginx(TLS) → / 는 이 컨테이너(8080), /api/ 는 gateway(8081) 로 직접 간다 (deploy/nginx-host.conf).
# 여기의 /api/ 블록은 로컬에서 localhost:8080 하나로 풀스택을 확인하기 위한 위임이다 — 운영 트래픽은 타지 않는다.
# API 프록시 규칙(SSE 타임아웃·buffering)은 gateway 의 deploy/nginx/default.conf 가 단일 기준이라 여기서는 튜닝하지 않는다.
#
# upstream 은 compose 서비스명이다. 변수 + resolver 를 쓰는 이유:
# 고정 proxy_pass 는 nginx 기동 시점에 DNS 를 조회해서 대상이 아직 없으면 nginx 자체가 죽는다.
# 변수를 쓰면 요청 시점에 조회하므로 기동 순서와 무관하게 살아 있다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://gateway:80;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 로컬 편의: /api 를 gateway 에 위임. SSE 는 gateway 가 130s 로 다루므로 여기는 그보다 길게만 둔다.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 140s;
        proxy_buffering off;
    }

    # 해시가 붙은 빌드 산출물은 장기 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history 모드: 나머지 경로는 index.html 로.
    # index.html 은 매 요청 재검증한다(no-cache. 캐시는 두되 조건부 요청 필수 → 대개 304).
    # 이 헤더가 없으면 브라우저가 옛 index.html 을 그대로 써서 배포가 반영되지 않거나,
    # 정리된 옛 해시 파일을 404 로 받아 화면이 깨진다 (S15P21B109-130).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
