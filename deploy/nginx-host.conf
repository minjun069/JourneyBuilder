# EC2 호스트 nginx 설정 — 참고용 사본. 실제 파일: /etc/nginx/sites-available/s15p21b109 (→ sites-enabled 심볼릭 링크)
# 역할: HTTPS 종단(certbot/Let's Encrypt) + 두 컨테이너로 분기
#   /api/  → 127.0.0.1:8081  gateway (deploy/nginx/default.conf — SSE 튠 130s, 오수만)
#   /      → 127.0.0.1:8080  web (front SPA)
# 443 블록은 certbot --nginx 가 인증서 발급 후 자동 추가·수정한다. 아래는 발급 전 기본형이다.

server {
    listen 80;
    listen [::]:80;
    server_name j15b109.p.ssafy.io;

    # certbot webroot 검증 경로 (nginx 플러그인을 쓰면 없어도 되지만 남겨 둔다)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # gateway 가 SSE 를 130s 로 처리하므로 그보다 길게. 버퍼링은 gateway 와 같이 끈다.
        proxy_read_timeout 140s;
        proxy_send_timeout 140s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
