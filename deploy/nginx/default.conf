# gateway nginx: /api 전용 리버스 프록시 (SSE 스트림 경로는 별도 튜닝).
#
# upstream 은 compose 서비스명 backend 를 가리킨다. 고정 `server backend:8000;` 은 nginx 기동 시 한 번만
# DNS 를 조회하므로 backend 컨테이너가 재생성되어 IP 가 바뀌면 옛 IP 를 계속 물고 /api 전체가 502 가 된다
# (2026-09-08 첫 자동 배포에서 발생). `resolve` 파라미터를 붙이면 resolver 의 valid 주기(10s)마다 다시 조회해
# gateway 재시작 없이 자동 회복한다. `resolve` 는 공유 메모리 `zone` 이 필요하고, 127.0.0.11 은 docker 내장 DNS 다.
upstream django_backend {
    zone django_backend 64k;
    server backend:8000 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location ~ ^/api/v(1|2)/consultations/[0-9]+/messages/stream/$ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
