# 운영(EC2) 전용 override. 루트 docker-compose.yml(팀 P03 실행환경) 위에 겹쳐서 쓴다.
#
#   docker compose --env-file /srv/s15p21b109/secrets/app.env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 루트 compose 는 건드리지 않는다(ai-docs/architecture/overview.md §3). 여기서 추가하는 것은 세 가지뿐:
#   1. web — front-pjt 이미지(nginx: SPA 정적 + /api·/admin → backend 프록시). 호스트에 바인딩되는 유일한 서비스.
#      호스트 nginx(TLS 종단, S15P21B109-123)가 127.0.0.1:8080 으로 넘긴다. 외부에 직접 열리지 않는다.
#   2. restart 정책 — 서버 재부팅·프로세스 종료 후 자동 복구. 상시 서비스 전부에 붙인다(migrate 는 one-shot 이라 제외).
#   3. 로그 상한 — 디스크가 로그로 차는 것을 막는다.
#
# 로컬에서도 같은 명령(--env-file 대신 .env)으로 운영과 같은 경로를 재현할 수 있다: http://localhost:8080

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    build:
      context: ./front-pjt
      # VITE_API_BASE_URL 은 넘기지 않는다 — front-pjt/Dockerfile 의 ARG 기본값이 유일한 출처다.
      # env 로 받으면 옛 값이 남은 env 파일이 이를 덮어써 전 API 가 404 가 된다 (S15P21B109-130).
    <<: [*restart, *logging]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    networks:
      - application

  postgres:
    <<: [*restart, *logging]

  redis:
    <<: [*restart, *logging]

  backend:
    <<: [*restart, *logging]

  ai-pjt:
    <<: [*restart, *logging]
    # GMS(gms.ssafy.io) 경유로 gemini 를 쓴다. GMS 키는 Google 키가 아니라서 Google 로 직접 가면
    # "API key not valid" 로 거부된다(2026-09-09 실측) → base URL 을 GMS 로 돌려야 한다.
    # google-genai SDK 가 GOOGLE_GEMINI_BASE_URL 을 읽고 x-goog-api-key 헤더로 키를 보내며,
    # 이는 GMS 문서의 호출 방식과 같다. 그래서 ai-pjt 코드는 고치지 않는다.
    # 두 값 모두 GMS 가 정하는 것이라 환경별로 바뀌지 않는다 → env 로 열지 않고 고정한다(S15P21B109-129/130 교훈).
    # 루트 compose 에도 같은 값이 고정돼 있으며, 이 override 는 운영 의도를 명시적으로 유지한다.
    # GOOGLE_API_KEY(=GMS 키)만 env 파일에서 온다.
    environment:
      GOOGLE_GEMINI_BASE_URL: "https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com"
      EMBEDDING_MODEL: "gemini-embedding-2"

  # gateway 는 루트 compose 에만 있어 여태 restart 정책이 없었다(도커 기본값 no).
  # 죽으면 사람이 올릴 때까지 /api 전체가 내려간다 — 상시 서비스이므로 다른 것과 같이 붙인다 (S15P21B109-128).
  gateway:
    <<: [*restart, *logging]
