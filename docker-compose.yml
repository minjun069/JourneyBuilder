x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}"
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
  POSTGRES_DB: "${POSTGRES_DB:-retirewise_db}"
  POSTGRES_USER: "${POSTGRES_USER:-retirewise}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  AI_SERVICE_URL: http://ai-pjt:8001
  AI_SERVICE_TIMEOUT_SECONDS: "${AI_SERVICE_TIMEOUT_SECONDS:-5}"
  AI_STREAM_READ_TIMEOUT_SECONDS: "${AI_STREAM_READ_TIMEOUT_SECONDS:-120}"
  AI_SERVICE_BEARER_TOKEN: "${AI_SERVICE_BEARER_TOKEN:?AI_SERVICE_BEARER_TOKEN is required}"
  READINESS_HOST: 127.0.0.1
  READINESS_PORT: "8000"
  READINESS_TIMEOUT_SECONDS: "${READINESS_TIMEOUT_SECONDS:-2}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-retirewise_db}"
      POSTGRES_USER: "${POSTGRES_USER:-retirewise}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/10-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    expose:
      - "5432"
    networks:
      - application

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    expose:
      - "6379"
    networks:
      - application

  migrate:
    build:
      context: .
      dockerfile: backend-pjt/Dockerfile
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  backend:
    build:
      context: .
      dockerfile: backend-pjt/Dockerfile
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - application

  gateway:
    image: nginx:1.29.1-alpine
    depends_on:
      - backend
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application

  ai-pjt:
    build:
      context: .
      dockerfile: ai-pjt/Dockerfile
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-gemini}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.5-flash-lite}"
      EMBEDDING_MODEL: "gemini-embedding-2"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_GEMINI_BASE_URL: "https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      AI_SERVICE_BEARER_TOKEN: "${AI_SERVICE_BEARER_TOKEN:?AI_SERVICE_BEARER_TOKEN is required}"
      AI_MASKING_PSEUDONYM_KEY: "${AI_MASKING_PSEUDONYM_KEY:?AI_MASKING_PSEUDONYM_KEY is required}"
      RAG_FINANCIAL_COLLECTION: "${RAG_FINANCIAL_COLLECTION:-financial-knowledge}"
      RAG_INTERFACE_COLLECTION: "${RAG_INTERFACE_COLLECTION:-interface-guides}"
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_FETCH_K: "${RAG_FETCH_K:-10}"
      RAG_MIN_DENSE_SCORE: "${RAG_MIN_DENSE_SCORE:-0.30}"
      RAG_INDEX_RETENTION_DAYS: "${RAG_INDEX_RETENTION_DAYS:-30}"
      EMBED_DIM: "${EMBED_DIM:-3072}"
      READINESS_HTTP_URL: http://127.0.0.1:8001/api/system/v1/health
      READINESS_TIMEOUT_SECONDS: "${READINESS_TIMEOUT_SECONDS:-2}"
      LANGFUSE_ENABLED: "${LANGFUSE_ENABLED:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-}"
      LANGFUSE_TRACING_ENVIRONMENT: "${LANGFUSE_TRACING_ENVIRONMENT:-default}"
      LANGFUSE_RELEASE: "${LANGFUSE_RELEASE:-}"
      LANGCHAIN_TRACING_V2: "false"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    networks:
      - application

volumes:
  postgres_data:
  redis_data:

networks:
  application:
    driver: bridge
